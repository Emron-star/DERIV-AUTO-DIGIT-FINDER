<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deriv Digit Finder + Signal Timer</title>
  <style>
    * { box-sizing: border-box; }
    body { background: #0b0d12; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 12px; }
    h1 { font-size: 20px; margin: 6px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    h2 { font-size: 15px; margin: 0 0 4px; display: flex; justify-content: space-between; align-items: center; }
    .top-bar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      background: #14181f; padding: 10px 14px; border-radius: 12px; margin-bottom: 14px;
      border: 1px solid #2a3344;
    }
    .top-bar select, .top-bar button, .top-bar label {
      background: #1f2937; color: #e2e8f0; border: 1px solid #374151;
      padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
    }
    .top-bar button { transition: background .2s; }
    .top-bar button.on { background: #065f46; border-color: #10b981; }
    .top-bar button.danger { border-color: #b91c1c; color: #fca5a5; }
    .top-bar button.danger:hover { background: #3b1a1a; }
    .top-bar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    #status {
      font-size: 13px; font-weight: 600;
      padding: 4px 10px; border-radius: 20px;
      background: #1f2937; margin-left: auto;
    }
    #status.live { color: #6ee7b7; }
    #status.connecting { color: #fbbf24; }
    #status.error { color: #fca5a5; }
    #tickCounter { font-size: 12px; color: #94a3b8; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
      gap: 14px;
    }
    .card {
      background: #14181f;
      border: 1px solid #2a3344;
      border-radius: 14px;
      padding: 14px 14px 12px;
      transition: border-color .2s, transform .15s, box-shadow .15s;
    }
    .card.flash { border-color: #10b981; box-shadow: 0 0 28px rgba(16,185,129,.5); transform: scale(1.02); }
    .card.hidden { display: none; }
    .card .price { font-family: monospace; font-size: 12px; color: #94a3b8; margin: 2px 0 6px; }
    .digits { display: flex; justify-content: space-around; align-items: center; margin: 6px 0 8px; }
    .digits .last { font-size: 40px; font-weight: 800; color: #60a5fa; line-height: 1; }
    .digits .pred { font-size: 40px; font-weight: 800; color: #fbbf24; line-height: 1; }
    .match { text-align: center; padding: 6px; border-radius: 8px; font-size: 13px; margin: 4px 0 6px; }
    .match.win { background: #064e3b; color: #6ee7b7; }
    .match.loss { background: #3b1a1a; color: #fca5a5; }
    .stats { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: #94a3b8; margin: 4px 0 6px; }
    .stats span { background: #1f2937; padding: 2px 8px; border-radius: 12px; }
    .stats .num { color: #e2e8f0; font-weight: 600; }
    .bar { display: flex; gap: 3px; margin: 8px 0 4px; height: 32px; align-items: flex-end; }
    .bar .col { flex: 1; min-width: 22px; background: #1f2937; border-radius: 4px 4px 0 0; position: relative; transition: height .2s; display: flex; flex-direction: column; align-items: center; font-size: 8px; color: #94a3b8; justify-content: flex-end; padding-bottom: 2px; }
    .bar .col.active { background: #3b82f6; }
    .bar .col.predict { background: #fbbf24; border: 1px solid #fbbf24; }
    .bar .col .label { font-size: 7px; color: #6b7280; margin-top: 2px; }
    .ticks { font-family: monospace; font-size: 10px; color: #6b7280; word-break: break-all; max-height: 48px; overflow-y: auto; background: #0b0d12; padding: 4px 6px; border-radius: 6px; margin-top: 4px; }
    .log {
      background: #14181f; border: 1px solid #2a3344; border-radius: 10px;
      padding: 10px; margin-top: 14px; max-height: 200px;
      overflow-y: auto; font-family: monospace; font-size: 12px; line-height: 1.6;
    }
    .log .entry { border-bottom: 1px solid #1f2937; padding: 2px 0; white-space: pre-wrap; word-break: break-all; }
    .log .entry.win { color: #6ee7b7; }
    .log .entry.loss { color: #fca5a5; }
    .log .entry.error { color: #fca5a5; background: #3b1a1a; padding: 2px 6px; border-radius: 4px; }
    .log .entry.info { color: #93c5fd; }

    /* Signal Timer UI */
    .signal-panel {
      background: #14181f; border: 1px solid #2a3344; border-radius: 14px;
      padding: 16px; margin-bottom: 14px; text-align: center;
      position: relative;
      min-height: 180px;
    }
    .signal-panel .phase-title {
      font-size: 22px; font-weight: 700; margin: 4px 0;
      transition: color 0.2s;
    }
    .signal-panel .timer-display {
      font-size: 64px; font-weight: 800; font-family: monospace;
      letter-spacing: 4px; margin: 6px 0;
      transition: color 0.2s;
    }
    .signal-panel .timer-display.blink {
      animation: blink 0.5s infinite alternate;
    }
    @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.4; } }
    .signal-panel .status-text {
      font-size: 18px; font-weight: 600; margin: 4px 0;
    }
    .signal-panel .progress-bar {
      width: 100%; height: 6px; background: #1f2937; border-radius: 4px;
      margin: 8px 0; overflow: hidden;
    }
    .signal-panel .progress-bar .fill {
      height: 100%; background: #7ec8e3; width: 0%; border-radius: 4px;
      transition: width 0.3s linear;
    }
    .signal-panel .window-dots {
      font-size: 28px; letter-spacing: 10px; margin: 8px 0;
    }
    .signal-panel .window-info {
      font-size: 14px; color: #94a3b8;
    }
    .signal-panel .result-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%;
      border-radius: 14px; display: flex; flex-direction: column;
      justify-content: center; align-items: center;
      background: rgba(0,0,0,0.85); font-size: 48px; font-weight: 800;
      backdrop-filter: blur(4px);
      transition: opacity 0.3s;
    }
    .signal-panel .result-overlay.hidden { display: none; }
    .result-overlay.win { color: #6ee7b7; }
    .result-overlay.loss { color: #fca5a5; }
    .result-overlay .sub { font-size: 18px; font-weight: 400; margin-top: 8px; }

    .settings {
      background: #14181f; border: 1px solid #2a3344; border-radius: 12px;
      padding: 14px; margin-bottom: 14px;
    }
    .settings .row {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin-bottom: 6px;
    }
    .settings label { font-size: 13px; color: #94a3b8; white-space: nowrap; }
    .settings input, .settings textarea, .settings select {
      background: #1f2937; border: 1px solid #374151; color: #e2e8f0;
      padding: 6px 10px; border-radius: 6px; font-size: 13px; flex: 1; min-width: 120px;
    }
    .settings textarea { min-height: 40px; font-family: monospace; resize: vertical; }
    .settings button {
      background: #1f2937; border: 1px solid #374151; color: #e2e8f0;
      padding: 6px 14px; border-radius: 6px; cursor: pointer;
      transition: .15s;
    }
    .settings button:hover { background: #2d3a4f; }
    .settings .hint { font-size: 12px; color: #6b7280; margin: 4px 0 0; }
    .settings .error-msg { color: #fca5a5; font-size: 13px; margin-top: 6px; }
  </style>
</head>
<body>
  <h1>📊 Deriv Digit Finder + Signal Timer</h1>

  <!-- Settings Panel -->
  <div class="settings" id="settingsPanel">
    <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:8px;">
      <span style="font-weight:600;">🔐 API Credentials</span>
      <button id="toggleSettings" style="background:transparent; border:none; color:#94a3b8; cursor:pointer;">▼</button>
    </div>
    <div id="settingsBody">
      <div class="row">
        <label>App ID:</label>
        <input type="text" id="appIdInput" placeholder="e.g. 1089" value="1089" />
        <label>API Token (optional):</label>
        <input type="password" id="apiTokenInput" placeholder="Paste token for OAuth" />
        <button id="saveSettingsBtn">Save & Connect</button>
        <button id="clearSettingsBtn" class="danger">Clear</button>
      </div>
      <div class="row">
        <label>Symbols (comma separated):</label>
        <textarea id="symbolsInput" rows="2">R_10, R_25, R_50, R_75, R_100, R_10_1S, R_25_1S, R_50_1S, R_75_1S, R_100_1S</textarea>
        <button id="loadDefaultSymbolsBtn" style="background:#1f2937; border:1px solid #374151; color:#e2e8f0; padding:6px 12px; border-radius:6px; cursor:pointer;">↺ Reset Defaults</button>
      </div>
      <div class="row">
        <label>Signal Symbol:</label>
        <select id="signalSymbolSelect">
          <option value="R_75_1S">Volatility 75 (1s)</option>
          <option value="R_75">Volatility 75</option>
          <option value="R_100_1S">Volatility 100 (1s)</option>
          <option value="R_100">Volatility 100</option>
          <option value="R_50_1S">Volatility 50 (1s)</option>
          <option value="R_50">Volatility 50</option>
        </select>
        <button id="startSignalBtn" style="background:#065f46; border-color:#10b981;">▶ Start Signal Timer</button>
        <button id="stopSignalBtn" class="danger">⏹ Stop</button>
      </div>
      <div class="hint">
        💡 For public data, use App ID <code>1089</code> with no token. The signal timer uses the selected symbol's prediction.
      </div>
      <div id="settingsError" class="error-msg" style="display:none;"></div>
    </div>
  </div>

  <!-- Top Bar -->
  <div class="top-bar">
    <label>Method:
      <select id="method">
        <option value="overdue">Overdue (gap)</option>
        <option value="hot">Hottest</option>
        <option value="cold">Coldest</option>
        <option value="balanced">Balanced</option>
      </select>
    </label>
    <button id="soundBtn">🔇 Enable Sound</button>
    <label><input type="checkbox" id="only1s"> Only 1s</label>
    <label><input type="checkbox" id="pause"> ⏸ Pause</label>
    <button id="reconnectBtn" class="danger">🔌 Reconnect</button>
    <button id="clearBtn" class="danger">🗑 Clear</button>
    <span id="status" class="connecting">● Connecting…</span>
    <span id="tickCounter">📡 0 ticks</span>
  </div>

  <!-- Signal Timer Panel -->
  <div class="signal-panel" id="signalPanel">
    <div class="phase-title" id="phaseTitle">⏳ COLLECTING TICKS</div>
    <div class="timer-display" id="timerDisplay">--</div>
    <div class="status-text" id="statusText">Collecting ticks…</div>
    <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
    <div class="window-dots" id="windowDots">• • • • •</div>
    <div class="window-info" id="windowInfo">Waiting for ticks…</div>

    <!-- Result Overlay -->
    <div class="result-overlay hidden" id="resultOverlay">
      <div id="resultText">WIN ✓</div>
      <div class="sub" id="resultSub">Continuing in 3s…</div>
    </div>
  </div>

  <!-- Grid -->
  <div id="grid" class="grid"></div>
  <div class="log" id="log"></div>

  <script>
    // ─── CONFIG ───────────────────────────────────────────────────────
    const MAX_HISTORY = 500;
    const STORAGE_KEY = 'deriv_auto_history';
    const CRED_KEY = 'deriv_creds';

    const SYMBOL_DEFS = {
      'R_10': 'Volatility 10',
      'R_25': 'Volatility 25',
      'R_50': 'Volatility 50',
      'R_75': 'Volatility 75',
      'R_100': 'Volatility 100',
      'R_10_1S': 'Volatility 10 (1s)',
      'R_25_1S': 'Volatility 25 (1s)',
      'R_50_1S': 'Volatility 50 (1s)',
      'R_75_1S': 'Volatility 75 (1s)',
      'R_100_1S': 'Volatility 100 (1s)',
      'R_15_1S': 'Volatility 15 (1s)',
      'R_30_1S': 'Volatility 30 (1s)',
      'R_90_1S': 'Volatility 90 (1s)',
      'R_150_1S': 'Volatility 150 (1s)',
      'R_250_1S': 'Volatility 250 (1s)'
    };
    const DEFAULT_SYMBOLS = ['R_10', 'R_25', 'R_50', 'R_75', 'R_100', 'R_10_1S', 'R_25_1S', 'R_50_1S', 'R_75_1S', 'R_100_1S'];

    function getDisplayName(ticker) { return SYMBOL_DEFS[ticker] || ticker; }

    // ─── STATE ───────────────────────────────────────────────────────
    let symbols = [];
    const state = {};
    function initSymbols(symList) {
      symbols = symList.map(s => s.trim()).filter(s => s);
      symbols.forEach(sym => {
        if (!state[sym]) {
          state[sym] = {
            history: [], counter: Array(10).fill(0), gaps: Array(10).fill(0),
            lastPrice: '-', lastDigit: '-', predicted: '-', lastPrediction: undefined,
            wins: 0, losses: 0, streak: 0, bestStreak: 0, totalPredictions: 0
          };
        }
      });
    }
    initSymbols(DEFAULT_SYMBOLS);

    let soundEnabled = false, audioCtx = null;
    let ws = null, reconnectAttempts = 0, paused = false;
    const MAX_RECONNECT = 12;
    let globalTickCount = 0;

    // ─── Signal Timer State ────────────────────────────────────────
    let signalRunning = false;
    let signalSymbol = 'R_75_1S';
    let signalPhase = 'idle'; // idle, collecting, ready, go, window, result
    let signalCountdown = 0;
    let signalTimerInterval = null;
    let signalWindowTicks = [];
    let signalPredictedDigit = '-';
    let signalResultShown = false;
    let signalCollectCount = 0;
    const COLLECT_THRESHOLD = 50;

    // ─── DOM refs ────────────────────────────────────────────────────
    const gridEl = document.getElementById('grid');
    const logEl = document.getElementById('log');
    const methodSelect = document.getElementById('method');
    const soundBtn = document.getElementById('soundBtn');
    const only1sCheck = document.getElementById('only1s');
    const pauseCheck = document.getElementById('pause');
    const clearBtn = document.getElementById('clearBtn');
    const reconnectBtn = document.getElementById('reconnectBtn');
    const statusEl = document.getElementById('status');
    const tickCounterEl = document.getElementById('tickCounter');
    const appIdInput = document.getElementById('appIdInput');
    const apiTokenInput = document.getElementById('apiTokenInput');
    const symbolsInput = document.getElementById('symbolsInput');
    const signalSymbolSelect = document.getElementById('signalSymbolSelect');
    const startSignalBtn = document.getElementById('startSignalBtn');
    const stopSignalBtn = document.getElementById('stopSignalBtn');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const clearSettingsBtn = document.getElementById('clearSettingsBtn');
    const loadDefaultSymbolsBtn = document.getElementById('loadDefaultSymbolsBtn');
    const settingsError = document.getElementById('settingsError');
    const toggleSettingsBtn = document.getElementById('toggleSettings');
    const settingsBody = document.getElementById('settingsBody');

    // Signal UI
    const phaseTitle = document.getElementById('phaseTitle');
    const timerDisplay = document.getElementById('timerDisplay');
    const statusText = document.getElementById('statusText');
    const progressFill = document.getElementById('progressFill');
    const windowDots = document.getElementById('windowDots');
    const windowInfo = document.getElementById('windowInfo');
    const resultOverlay = document.getElementById('resultOverlay');
    const resultText = document.getElementById('resultText');
    const resultSub = document.getElementById('resultSub');

    // ─── load/save credentials ──────────────────────────────────────
    function loadCredentials() {
      try {
        const raw = localStorage.getItem(CRED_KEY);
        if (raw) {
          const cred = JSON.parse(raw);
          if (cred.appId) appIdInput.value = cred.appId;
          if (cred.token) apiTokenInput.value = cred.token;
          if (cred.symbols) symbolsInput.value = cred.symbols;
          if (cred.signalSymbol) signalSymbolSelect.value = cred.signalSymbol;
        }
      } catch (_) {}
    }
    function saveCredentials(appId, token, symStr, sigSym) {
      try {
        localStorage.setItem(CRED_KEY, JSON.stringify({ appId, token, symbols: symStr, signalSymbol: sigSym }));
      } catch (_) {}
    }
    function clearCredentials() {
      localStorage.removeItem(CRED_KEY);
      appIdInput.value = '';
      apiTokenInput.value = '';
    }

    // ─── history ──────────────────────────────────────────────────
    function loadHistory() {
      try { const raw = localStorage.getItem(STORAGE_KEY); if (!raw) return; const data = JSON.parse(raw); symbols.forEach(sym => { if (data[sym]) { state[sym].history = data[sym].slice(-MAX_HISTORY); state[sym].counter = Array(10).fill(0); state[sym].history.forEach(d => state[sym].counter[d]++); } }); } catch (_) {}
    }
    function saveHistory() {
      try { const data = {}; symbols.forEach(sym => data[sym] = state[sym].history); localStorage.setItem(STORAGE_KEY, JSON.stringify(data)); } catch (_) {}
    }

    // ─── audio ──────────────────────────────────────────────────────
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playBeep(freq, duration = 0.12) {
      if (!soundEnabled || !audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }
    function playDoubleBeep() {
      playBeep(1200, 0.32);
      setTimeout(() => playBeep(1200, 0.32), 350);
    }

    // ─── prediction ──────────────────────────────────────────────────
    function analyze(sym) {
      const st = state[sym], h = st.history;
      if (h.length < 20) return '-';
      const method = methodSelect.value, c = st.counter;
      for (let d = 0; d < 10; d++) { let g = 0; for (let i = h.length-1; i>=0; i--) { if (h[i]===d) break; g++; } st.gaps[d]=g; }
      let best = 0;
      if (method === 'overdue') { let max = st.gaps[0]; for (let d=1; d<10; d++) if (st.gaps[d] > max) { max = st.gaps[d]; best = d; } }
      else if (method === 'hot') { let max = c[0]; for (let d=1; d<10; d++) if (c[d] > max) { max = c[d]; best = d; } }
      else if (method === 'cold') { let min = c[0]; for (let d=1; d<10; d++) if (c[d] < min) { min = c[d]; best = d; } }
      else { const t = h.length / 10; let bd = Math.abs(c[0]-t), best = 0; for (let d=1; d<10; d++) { const diff = Math.abs(c[d]-t); if (diff < bd) { bd = diff; best = d; } } }
      return best;
    }

    // ─── rendering ──────────────────────────────────────────────────
    let pendingCards = new Set(), renderScheduled = false;
    function scheduleRender(sym) { pendingCards.add(sym); if (!renderScheduled) { renderScheduled = true; requestAnimationFrame(() => { pendingCards.forEach(s => renderCard(s)); pendingCards.clear(); renderScheduled = false; }); } }

    function renderCard(sym) {
      const st = state[sym], card = document.getElementById('card-'+sym); if (!card) return;
      const displayName = getDisplayName(sym);
      const pred = st.predicted, win = pred !== '-' && st.lastDigit === pred && st.history.length >= 20;
      card.querySelector('.price').textContent = st.lastPrice + ' | ' + st.history.length + ' ticks';
      card.querySelector('.last').textContent = st.lastDigit;
      card.querySelector('.pred').textContent = pred;
      const matchEl = card.querySelector('.match');
      if (st.history.length < 20) { matchEl.textContent = '⏳ Collecting data…'; matchEl.className = 'match'; }
      else { matchEl.textContent = win ? `✅ MATCH! Predicted ${pred} HIT` : `❌ Predict ${pred} | Last ${st.lastDigit}`; matchEl.className = 'match ' + (win ? 'win' : 'loss'); }

      const total = st.totalPredictions, rate = total > 0 ? Math.round((st.wins/total)*100) : 0;
      card.querySelector('.stats').innerHTML = `<span>Wins: <span class="num">${st.wins}</span></span><span>Losses: <span class="num">${st.losses}</span></span><span>Rate: <span class="num">${rate}%</span></span><span>Streak: <span class="num">${st.streak}</span></span><span>Best: <span class="num">${st.bestStreak}</span></span>`;
      const gapEl = card.querySelector('.gap'); gapEl.textContent = pred !== '-' ? st.gaps[pred] + ' ticks' : '-';

      const bar = card.querySelector('.bar'); bar.innerHTML = '';
      const maxCount = Math.max(1, ...st.counter);
      for (let d = 0; d < 10; d++) {
        const col = document.createElement('div'); col.className = 'col';
        const h = (st.counter[d]/maxCount)*28 + 4; col.style.height = h + 'px';
        if (d === st.lastDigit) col.classList.add('active');
        if (d === pred) col.classList.add('predict');
        col.innerHTML = `<span>${st.counter[d]}</span><span class="label">${d}</span>`;
        bar.appendChild(col);
      }
      card.querySelector('.ticks').textContent = st.history.slice(-60).join(' ');
    }

    function buildGrid() {
      gridEl.innerHTML = '';
      symbols.forEach(sym => {
        const displayName = getDisplayName(sym);
        const card = document.createElement('div'); card.className = 'card'; card.id = 'card-'+sym;
        card.innerHTML = `
          <h2><span>${displayName}</span> <span style="font-size:11px;color:#6b7280;">${sym}</span></h2>
          <div class="price">-</div>
          <div class="digits"><span class="last">-</span><span style="font-size:20px;color:#6b7280;">→</span><span class="pred">-</span></div>
          <div class="match">Waiting…</div>
          <div class="stats">-</div>
          <div style="font-size:11px;color:#94a3b8;">Gap: <span class="gap">-</span></div>
          <div class="bar"></div>
          <div class="ticks"></div>
        `;
        gridEl.appendChild(card);
      });
      symbols.forEach(sym => renderCard(sym));
    }

    function addLog(entry, type = 'loss') {
      const div = document.createElement('div');
      div.className = 'entry';
      if (type === 'win') div.classList.add('win');
      else if (type === 'error') div.classList.add('error');
      else if (type === 'info') div.classList.add('info');
      else div.classList.add('loss');
      div.textContent = entry;
      logEl.prepend(div);
      while (logEl.children.length > 200) logEl.removeChild(logEl.lastChild);
    }

    // ─── process tick ─────────────────────────────────────────────
    function processTick(sym, quote, digit) {
      if (paused) return;
      const st = state[sym];
      if (!st) return;
      st.history.push(digit); if (st.history.length > MAX_HISTORY) st.history.shift();
      st.lastPrice = quote; st.lastDigit = digit;
      st.counter[digit] = (st.counter[digit] || 0) + 1;
      const newPred = analyze(sym);
      const oldPred = st.predicted;
      st.predicted = newPred;

      // Update prediction for signal symbol
      if (sym === signalSymbol && signalRunning) {
        signalPredictedDigit = newPred;
        // If we are in collecting phase, count ticks
        if (signalPhase === 'collecting') {
          signalCollectCount = st.history.length;
          updateCollectUI();
        }
        // If we are in window phase, collect ticks
        if (signalPhase === 'window') {
          signalWindowTicks.push(digit);
          updateWindowUI();
          // If we have 5 ticks, close window and show result
          if (signalWindowTicks.length === 5) {
            closeWindowAndShowResult();
          }
        }
      }

      // Normal match detection for all symbols (keeps cards updating)
      if (oldPred !== '-' && st.history.length >= 21 && st.lastPrediction !== undefined && st.lastPrediction !== '-') {
        const win = digit === st.lastPrediction;
        st.totalPredictions++;
        if (win) { st.wins++; st.streak++; if (st.streak > st.bestStreak) st.bestStreak = st.streak; }
        else { st.losses++; st.streak = 0; }
        if (win) {
          const only1s = only1sCheck.checked, is1s = sym.includes('1S');
          if (!only1s || is1s) {
            playBeep(is1s ? 880 : 660);
            const card = document.getElementById('card-'+sym);
            if (card) { card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 800); }
            if (navigator.vibrate) navigator.vibrate([80,50,80]);
          }
        }
        saveHistory();
      }
      st.lastPrediction = newPred;
      scheduleRender(sym);
    }

    // ─── Signal Timer Functions ─────────────────────────────────────
    function updateCollectUI() {
      const st = state[signalSymbol];
      const count = st ? st.history.length : 0;
      phaseTitle.textContent = `⏳ COLLECTING TICKS… ${count}/${COLLECT_THRESHOLD}`;
      timerDisplay.textContent = '--';
      statusText.textContent = `Collecting ${getDisplayName(signalSymbol)}…`;
      progressFill.style.width = Math.min(100, (count / COLLECT_THRESHOLD) * 100) + '%';
      windowDots.textContent = '• • • • •';
      windowInfo.textContent = `Need ${COLLECT_THRESHOLD} ticks to start signal`;
    }

    function startSignal() {
      if (signalRunning) return;
      const sym = signalSymbolSelect.value;
      signalSymbol = sym;
      signalRunning = true;
      signalPhase = 'collecting';
      signalWindowTicks = [];
      signalResultShown = false;
      resultOverlay.classList.add('hidden');

      // Check if we already have enough ticks
      const st = state[signalSymbol];
      if (st && st.history.length >= COLLECT_THRESHOLD) {
        // Ready to start the timer
        beginCountdown();
      } else {
        // Enter collecting phase
        updateCollectUI();
        addLog(`⏳ Signal: Collecting ${COLLECT_THRESHOLD} ticks for ${getDisplayName(signalSymbol)}`, 'info');
      }
    }

    function stopSignal() {
      signalRunning = false;
      if (signalTimerInterval) {
        clearInterval(signalTimerInterval);
        signalTimerInterval = null;
      }
      signalPhase = 'idle';
      phaseTitle.textContent = '⏹ SIGNAL STOPPED';
      timerDisplay.textContent = '--';
      statusText.textContent = 'Press Start to begin';
      progressFill.style.width = '0%';
      windowDots.textContent = '• • • • •';
      windowInfo.textContent = '';
      resultOverlay.classList.add('hidden');
      addLog('⏹ Signal timer stopped', 'info');
    }

    function beginCountdown() {
      if (!signalRunning) return;
      signalPhase = 'ready';
      signalCountdown = 15;
      signalWindowTicks = [];
      signalResultShown = false;
      resultOverlay.classList.add('hidden');

      // Get current prediction for the signal symbol
      const st = state[signalSymbol];
      signalPredictedDigit = st ? st.predicted : '-';
      if (signalPredictedDigit === '-') {
        addLog('⚠️ Not enough ticks to predict yet. Waiting for more data.', 'error');
        // Wait and retry in 2s
        setTimeout(() => { if (signalRunning) beginCountdown(); }, 2000);
        return;
      }

      addLog(`🔔 Signal started for ${getDisplayName(signalSymbol)} | Predicted digit: ${signalPredictedDigit}`, 'info');

      if (signalTimerInterval) clearInterval(signalTimerInterval);
      signalTimerInterval = setInterval(() => {
        if (!signalRunning) { clearInterval(signalTimerInterval); signalTimerInterval = null; return; }
        signalCountdown--;
        updateTimerUI();

        if (signalCountdown <= 0) {
          clearInterval(signalTimerInterval);
          signalTimerInterval = null;
          // Start trade window
          enterTradeWindow();
        }
      }, 1000);

      // Force initial UI update
      updateTimerUI();
    }

    function updateTimerUI() {
      const remaining = signalCountdown;
      const total = 15;
      const progress = ((total - remaining) / total) * 100;

      if (signalPhase === 'ready') {
        // READY phase: 15 down to 6
        if (remaining >= 6) {
          phaseTitle.textContent = '◉ SIGNAL FOUND - READY';
          phaseTitle.style.color = '#ffcc33';
          timerDisplay.textContent = String(remaining).padStart(2, '0') + ':00';
          timerDisplay.style.color = '#7ec8e3';
          timerDisplay.classList.remove('blink');
          statusText.textContent = 'READY';
          statusText.style.color = '#ffcc33';
          progressFill.style.background = '#7ec8e3';
          progressFill.style.width = progress + '%';
          windowDots.textContent = '• • • • •';
          windowInfo.textContent = `Ready in ${remaining}s`;
          // No sound for ready phase (or very low)
        } else if (remaining >= 1 && remaining <= 5) {
          // GO TIME phase: 5 down to 1
          signalPhase = 'go';
          phaseTitle.textContent = '◉ GO TIME!';
          phaseTitle.style.color = '#ff3b3b';
          timerDisplay.textContent = String(remaining).padStart(2, '0') + ':00';
          timerDisplay.style.color = '#ff3b3b';
          timerDisplay.classList.add('blink');
          statusText.textContent = 'GO TIME! ⚡';
          statusText.style.color = '#ff3b3b';
          progressFill.style.background = '#ff3b3b';
          progressFill.style.width = progress + '%';
          windowDots.textContent = '• • • • •';
          windowInfo.textContent = `GO in ${remaining}s`;
          // Beep each second
          playBeep(900);
        }
      } else if (signalPhase === 'window') {
        // Window phase: timer hidden, show dots
        phaseTitle.textContent = '● TRADE WINDOW ACTIVE';
        phaseTitle.style.color = '#60a5fa';
        timerDisplay.textContent = '--';
        timerDisplay.classList.remove('blink');
        statusText.textContent = 'WINDOW OPEN';
        statusText.style.color = '#60a5fa';
        progressFill.style.width = '100%';
        // Dots updated separately
      } else if (signalPhase === 'result') {
        // Result handled separately
      }
    }

    function enterTradeWindow() {
      if (!signalRunning) return;
      signalPhase = 'window';
      signalWindowTicks = [];
      resultOverlay.classList.add('hidden');

      phaseTitle.textContent = '● TRADE WINDOW ACTIVE';
      phaseTitle.style.color = '#60a5fa';
      timerDisplay.textContent = '--';
      timerDisplay.classList.remove('blink');
      statusText.textContent = 'WINDOW OPEN';
      statusText.style.color = '#60a5fa';
      progressFill.style.width = '100%';
      windowDots.textContent = '• • • • •';
      windowInfo.textContent = 'Waiting for 5 ticks…';

      playDoubleBeep();
      addLog(`🚪 Trade window opened for ${getDisplayName(signalSymbol)}. Waiting for 5 ticks.`, 'info');

      // If ticks already coming, they'll fill the window via processTick
    }

    function updateWindowUI() {
      const ticks = signalWindowTicks;
      const dots = ticks.map(t => t.toString()).join(' ');
      const empty = '•';
      const fullDots = ticks.map(t => t).join(' ');
      const remaining = 5 - ticks.length;
      windowDots.textContent = ticks.length === 0 ? '• • • • •' : fullDots.padEnd(9, ' •');
      // Show actual digits
      let display = '';
      for (let i = 0; i < 5; i++) {
        if (i < ticks.length) display += ticks[i] + ' ';
        else display += '• ';
      }
      windowDots.textContent = display.trim();
      windowInfo.textContent = `Tick ${ticks.length}/5 got ${ticks.length>0?ticks.join(','):'…'} need ${5-ticks.length} more`;
    }

    function closeWindowAndShowResult() {
      if (!signalRunning) return;
      signalPhase = 'result';
      clearInterval(signalTimerInterval);
      signalTimerInterval = null;

      const pred = signalPredictedDigit;
      const ticks = signalWindowTicks;
      const win = ticks.some(t => t === pred);

      // Show result overlay
      resultOverlay.classList.remove('hidden');
      if (win) {
        resultText.textContent = 'WIN ✓';
        resultText.style.color = '#6ee7b7';
        resultOverlay.style.border = '3px solid #6ee7b7';
        resultOverlay.className = 'result-overlay win';
        addLog(`✅ SIGNAL WIN! Predicted ${pred} appeared in ${ticks.join(',')}`, 'win');
        playDoubleBeep();
      } else {
        resultText.textContent = 'LOSS ✕';
        resultText.style.color = '#fca5a5';
        resultOverlay.style.border = '3px solid #fca5a5';
        resultOverlay.className = 'result-overlay loss';
        addLog(`❌ SIGNAL LOSS! Predicted ${pred} did not appear in ${ticks.join(',')}`, 'loss');
      }

      // Start countdown to restart
      let countdown = 3;
      resultSub.textContent = `Continuing in ${countdown}s…`;
      const resultInterval = setInterval(() => {
        countdown--;
        if (countdown <= 0) {
          clearInterval(resultInterval);
          // Restart cycle
          resultOverlay.classList.add('hidden');
          if (signalRunning) {
            beginCountdown();
          }
        } else {
          resultSub.textContent = `Continuing in ${countdown}s…`;
        }
      }, 1000);

      // Update UI for result phase
      phaseTitle.textContent = win ? '✅ WIN' : '❌ LOSS';
      phaseTitle.style.color = win ? '#6ee7b7' : '#fca5a5';
      timerDisplay.textContent = '--';
      statusText.textContent = win ? 'WINNER' : 'LOSS';
      progressFill.style.width = '100%';
      progressFill.style.background = win ? '#6ee7b7' : '#fca5a5';
      windowInfo.textContent = `Result: ${win ? 'WIN' : 'LOSS'} in 5 ticks`;
    }

    // ─── WebSocket ──────────────────────────────────────────────────
    function connect() {
      const appId = appIdInput.value.trim();
      if (!appId) {
        settingsError.textContent = '⚠️ Please enter your App ID.';
        settingsError.style.display = 'block';
        return;
      }
      settingsError.style.display = 'none';

      const symStr = symbolsInput.value.trim();
      const symList = symStr.split(',').map(s => s.trim()).filter(s => s);
      if (symList.length === 0) {
        settingsError.textContent = '⚠️ Please enter at least one symbol.';
        settingsError.style.display = 'block';
        return;
      }
      initSymbols(symList);
      buildGrid();
      loadHistory();

      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) ws.close();

      const wsUrl = `wss://api.derivws.com/trading/v1/options/ws/public?app_id=${appId}`;
      console.log(`🔗 Connecting to ${wsUrl}`);
      addLog(`🔗 Connecting to public WebSocket (app_id: ${appId})`, 'info');
      statusEl.className = 'connecting';
      statusEl.textContent = '● Connecting…';
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log('✅ WebSocket opened');
        addLog('✅ WebSocket opened', 'info');
        statusEl.className = 'live';
        statusEl.textContent = '● Live';
        reconnectAttempts = 0;

        symbols.forEach(sym => {
          const req = { ticks: sym, subscribe: 1 };
          console.log(`📤 Sending subscribe: ${JSON.stringify(req)}`);
          ws.send(JSON.stringify(req));
        });
        addLog(`📡 Subscribed to ${symbols.length} symbols`, 'info');
      };

      ws.onmessage = (msg) => {
        try {
          const data = JSON.parse(msg.data);
          console.log('📨 Message received:', data);
          if (data.error) {
            console.error('❌ Server error:', data.error);
            addLog(`❌ Server error: ${data.error.message} (code: ${data.error.code})`, 'error');
            settingsError.textContent = `Server error: ${data.error.message}`;
            settingsError.style.display = 'block';
            return;
          }
          if (!data.tick) return;
          const sym = data.tick.symbol;
          if (!state[sym]) {
            console.warn(`⚠️ Unknown symbol: ${sym}`);
            return;
          }
          const quote = data.tick.quote;
          if (quote === undefined || quote === null) return;
          const digit = parseInt(quote.toString().slice(-1));
          if (isNaN(digit)) return;

          globalTickCount++;
          tickCounterEl.textContent = `📡 ${globalTickCount} ticks`;
          processTick(sym, quote.toString(), digit);

          // If we are in collecting phase, check threshold
          if (sym === signalSymbol && signalRunning && signalPhase === 'collecting') {
            const st = state[signalSymbol];
            if (st && st.history.length >= COLLECT_THRESHOLD) {
              // We have enough ticks, start countdown
              beginCountdown();
            }
          }
        } catch (e) {
          console.warn('⚠️ Error parsing message:', e);
        }
      };

      ws.onclose = (event) => {
        console.warn(`⚠️ WebSocket closed: code=${event.code}, reason=${event.reason || 'none'}`);
        addLog(`⚠️ WebSocket closed (code: ${event.code})`, 'error');
        statusEl.className = 'error';
        statusEl.textContent = '● Disconnected';
        if (reconnectAttempts < MAX_RECONNECT) {
          reconnectAttempts++;
          const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
          console.log(`⏳ Reconnecting in ${delay/1000}s (attempt ${reconnectAttempts})`);
          addLog(`⏳ Reconnecting in ${delay/1000}s (attempt ${reconnectAttempts})`, 'info');
          setTimeout(connect, delay);
        } else {
          statusEl.textContent = '⚠️ Failed – refresh page';
          console.error('❌ Max reconnection attempts reached.');
          addLog('❌ Max reconnection attempts reached. Please refresh.', 'error');
        }
      };

      ws.onerror = (err) => {
        console.error('❌ WebSocket error:', err);
        addLog(`❌ WebSocket error: ${err.message || 'unknown'}`, 'error');
      };
    }

    // ─── clear history ─────────────────────────────────────────────
    function clearHistory() {
      if (!confirm('Clear all history and stats?')) return;
      symbols.forEach(sym => {
        const st = state[sym];
        if (st) {
          st.history = []; st.counter = Array(10).fill(0); st.gaps = Array(10).fill(0);
          st.lastPrice = '-'; st.lastDigit = '-'; st.predicted = '-'; st.lastPrediction = undefined;
          st.wins = 0; st.losses = 0; st.streak = 0; st.bestStreak = 0; st.totalPredictions = 0;
        }
      });
      localStorage.removeItem(STORAGE_KEY);
      logEl.innerHTML = '';
      symbols.forEach(sym => renderCard(sym));
      statusEl.textContent = '● Cleared';
      setTimeout(() => statusEl.textContent = '● Live', 1000);
      stopSignal();
    }

    // ─── event listeners ──────────────────────────────────────────
    methodSelect.addEventListener('change', () => {
      symbols.forEach(sym => { if (state[sym] && state[sym].history.length >= 20) { state[sym].predicted = analyze(sym); scheduleRender(sym); } });
    });

    soundBtn.addEventListener('click', () => {
      if (!audioCtx) initAudio();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      soundEnabled = !soundEnabled;
      soundBtn.textContent = soundEnabled ? '🔔 Sound ON' : '🔇 Enable Sound';
      soundBtn.classList.toggle('on', soundEnabled);
      if (soundEnabled) playBeep(660);
    });

    pauseCheck.addEventListener('change', () => { paused = pauseCheck.checked; statusEl.textContent = paused ? '⏸ Paused' : '● Live'; statusEl.className = paused ? '' : 'live'; });
    clearBtn.addEventListener('click', clearHistory);

    reconnectBtn.addEventListener('click', () => { if (ws) { ws.close(); } connect(); });

    only1sCheck.addEventListener('change', () => {
      symbols.forEach(sym => { const card = document.getElementById('card-'+sym); if (!card) return; const is1s = sym.includes('1S'); if (only1sCheck.checked && !is1s) card.classList.add('hidden'); else card.classList.remove('hidden'); });
    });

    saveSettingsBtn.addEventListener('click', () => {
      const appId = appIdInput.value.trim();
      const token = apiTokenInput.value.trim();
      const symStr = symbolsInput.value.trim();
      const sigSym = signalSymbolSelect.value;
      if (!appId) { settingsError.textContent = '⚠️ App ID is required.'; settingsError.style.display = 'block'; return; }
      if (!symStr) { settingsError.textContent = '⚠️ Please enter at least one symbol.'; settingsError.style.display = 'block'; return; }
      settingsError.style.display = 'none';
      saveCredentials(appId, token, symStr, sigSym);
      if (ws) { ws.close(); }
      connect();
    });

    clearSettingsBtn.addEventListener('click', () => {
      clearCredentials();
      settingsError.style.display = 'none';
      if (ws) { ws.close(); }
    });

    loadDefaultSymbolsBtn.addEventListener('click', () => {
      symbolsInput.value = DEFAULT_SYMBOLS.join(', ');
    });

    startSignalBtn.addEventListener('click', startSignal);
    stopSignalBtn.addEventListener('click', stopSignal);

    let settingsVisible = true;
    toggleSettingsBtn.addEventListener('click', () => {
      settingsVisible = !settingsVisible;
      settingsBody.style.display = settingsVisible ? 'block' : 'none';
      toggleSettingsBtn.textContent = settingsVisible ? '▼' : '▶';
    });

    // ─── start ──────────────────────────────────────────────────────
    loadCredentials();
    const savedCred = localStorage.getItem(CRED_KEY);
    if (savedCred) {
      try {
        const cred = JSON.parse(savedCred);
        if (cred.symbols) symbolsInput.value = cred.symbols;
        if (cred.signalSymbol) signalSymbolSelect.value = cred.signalSymbol;
      } catch (_) {}
    }
    initSymbols(symbolsInput.value.split(',').map(s => s.trim()).filter(s => s));
    loadHistory();
    buildGrid();
    symbols.forEach(sym => { if (state[sym] && state[sym].history.length >= 20) { state[sym].predicted = analyze(sym); scheduleRender(sym); } });

    if (appIdInput.value.trim()) {
      connect();
    } else {
      statusEl.textContent = '● Enter App ID above';
      statusEl.className = 'connecting';
    }

    setInterval(saveHistory, 10000);
    window.addEventListener('beforeunload', saveHistory);
    only1sCheck.dispatchEvent(new Event('change'));

    // initial signal UI
    updateCollectUI();
  </script>
</body>
</html>
