<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Multi‑Market Signal Scanner</title>
  <style>
    * { box-sizing: border-box; }
    body { background: #0b0d12; color: #e2e8f0; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 12px; }
    h1 { font-size: 20px; margin: 6px 0; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .top-bar {
      display: flex; flex-wrap: wrap; gap: 8px; align-items: center;
      background: #14181f; padding: 10px 14px; border-radius: 12px; margin-bottom: 14px;
      border: 1px solid #2a3344;
    }
    .top-bar select, .top-bar button, .top-bar label {
      background: #1f2937; color: #e2e8f0; border: 1px solid #374151;
      padding: 6px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
    }
    .top-bar button { transition: background .2s; }
    .top-bar button.on { background: #065f46; border-color: #10b981; }
    .top-bar button.danger { border-color: #b91c1c; color: #fca5a5; }
    .top-bar button.danger:hover { background: #3b1a1a; }
    .top-bar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
    #status {
      font-size: 13px; font-weight: 600;
      padding: 4px 10px; border-radius: 20px;
      background: #1f2937; margin-left: auto;
    }
    #status.live { color: #6ee7b7; }
    #status.connecting { color: #fbbf24; }
    #status.error { color: #fca5a5; }
    #tickCounter { font-size: 12px; color: #94a3b8; }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 14px;
    }
    .card {
      background: #14181f;
      border: 1px solid #2a3344;
      border-radius: 14px;
      padding: 14px 12px;
      transition: border-color .2s, transform .15s, box-shadow .15s;
      position: relative;
    }
    .card .title {
      font-weight: 600; font-size: 15px; display: flex; justify-content: space-between;
    }
    .card .price { font-family: monospace; font-size: 12px; color: #94a3b8; margin: 2px 0 4px; }
    .card .digits { display: flex; justify-content: space-between; align-items: center; margin: 4px 0; }
    .card .digits .last { font-size: 32px; font-weight: 800; color: #60a5fa; }
    .card .digits .pred { font-size: 32px; font-weight: 800; color: #fbbf24; }
    .card .info { font-size: 12px; color: #94a3b8; }
    .card .dots { font-size: 20px; letter-spacing: 6px; margin: 4px 0; }
    .card .result { text-align: center; padding: 4px; border-radius: 6px; font-weight: 600; }
    .card .result.win { background: #064e3b; color: #6ee7b7; }
    .card .result.loss { background: #3b1a1a; color: #fca5a5; }
    .card .result.pending { background: #1f2937; color: #94a3b8; }
    .card.win { border-color: #10b981; }
    .card.loss { border-color: #f87171; }
    .signal-panel {
      background: #14181f; border: 1px solid #2a3344; border-radius: 14px;
      padding: 16px; margin-bottom: 14px; text-align: center;
      position: relative;
      min-height: 120px;
    }
    .signal-panel .phase-title {
      font-size: 22px; font-weight: 700; margin: 4px 0;
      transition: color 0.2s;
    }
    .signal-panel .timer-display {
      font-size: 56px; font-weight: 800; font-family: monospace;
      letter-spacing: 4px; margin: 4px 0;
      transition: color 0.2s;
    }
    .signal-panel .timer-display.blink {
      animation: blink 0.5s infinite alternate;
    }
    @keyframes blink { 0% { opacity: 1; } 100% { opacity: 0.4; } }
    .signal-panel .status-text {
      font-size: 16px; font-weight: 600; margin: 2px 0;
    }
    .signal-panel .progress-bar {
      width: 100%; height: 6px; background: #1f2937; border-radius: 4px;
      margin: 6px 0; overflow: hidden;
    }
    .signal-panel .progress-bar .fill {
      height: 100%; background: #7ec8e3; width: 0%; border-radius: 4px;
      transition: width 0.3s linear;
    }
    .signal-panel .summary {
      font-size: 14px; color: #94a3b8; margin-top: 6px;
      max-height: 60px; overflow-y: auto;
    }
    .settings {
      background: #14181f; border: 1px solid #2a3344; border-radius: 12px;
      padding: 14px; margin-bottom: 14px;
    }
    .settings .row {
      display: flex; flex-wrap: wrap; gap: 10px; align-items: center;
      margin-bottom: 6px;
    }
    .settings label { font-size: 13px; color: #94a3b8; white-space: nowrap; }
    .settings input, .settings select {
      background: #1f2937; border: 1px solid #374151; color: #e2e8f0;
      padding: 6px 10px; border-radius: 6px; font-size: 13px; flex: 1; min-width: 120px;
    }
    .settings button {
      background: #1f2937; border: 1px solid #374151; color: #e2e8f0;
      padding: 6px 14px; border-radius: 6px; cursor: pointer;
      transition: .15s;
    }
    .settings button:hover { background: #2d3a4f; }
    .settings .hint { font-size: 12px; color: #6b7280; margin: 4px 0 0; }
    .settings .error-msg { color: #fca5a5; font-size: 13px; margin-top: 6px; }
    .log {
      background: #14181f; border: 1px solid #2a3344; border-radius: 10px;
      padding: 10px; margin-top: 14px; max-height: 200px;
      overflow-y: auto; font-family: monospace; font-size: 12px; line-height: 1.6;
    }
    .log .entry { border-bottom: 1px solid #1f2937; padding: 2px 0; white-space: pre-wrap; word-break: break-all; }
    .log .entry.win { color: #6ee7b7; }
    .log .entry.loss { color: #fca5a5; }
    .log .entry.error { color: #fca5a5; background: #3b1a1a; padding: 2px 6px; border-radius: 4px; }
    .log .entry.info { color: #93c5fd; }
  </style>
</head>
<body>
  <h1>📊 Multi‑Market Signal Scanner <span style="font-size:14px;font-weight:400;color:#94a3b8;">All Volatility + 1s</span></h1>

  <div class="settings">
    <div class="row">
      <label>App ID:</label>
      <input type="text" id="appIdInput" placeholder="e.g. 1089" value="1089" />
      <label>API Token (optional):</label>
      <input type="password" id="apiTokenInput" placeholder="Paste token for OAuth" />
      <button id="saveSettingsBtn">Save & Connect</button>
      <button id="clearSettingsBtn" class="danger">Clear</button>
    </div>
    <div class="row">
      <button id="startSignalBtn" style="background:#065f46; border-color:#10b981;">▶ Start Signal</button>
      <button id="stopSignalBtn" class="danger">⏹ Stop</button>
      <span id="status" class="connecting">● Connecting…</span>
      <span id="tickCounter">📡 0 ticks</span>
    </div>
    <div class="hint">💡 For public data, use App ID <code>1089</code> with no token. All 10 Volatility markets will be scanned.</div>
    <div id="settingsError" class="error-msg" style="display:none;"></div>
  </div>

  <!-- Signal Panel -->
  <div class="signal-panel" id="signalPanel">
    <div class="phase-title" id="phaseTitle">⏳ IDLE</div>
    <div class="timer-display" id="timerDisplay">--</div>
    <div class="status-text" id="statusText">Press Start to begin</div>
    <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
    <div class="summary" id="summary"></div>
  </div>

  <!-- Grid -->
  <div id="grid" class="grid"></div>
  <div class="log" id="log"></div>

  <script>
    // ─── CONSTANTS ────────────────────────────────────────────────────
    const SYMBOLS = [
      { id: 'R_10', name: 'Volatility 10' },
      { id: 'R_25', name: 'Volatility 25' },
      { id: 'R_50', name: 'Volatility 50' },
      { id: 'R_75', name: 'Volatility 75' },
      { id: 'R_100', name: 'Volatility 100' },
      { id: 'R_10_1S', name: 'Volatility 10 (1s)' },
      { id: 'R_25_1S', name: 'Volatility 25 (1s)' },
      { id: 'R_50_1S', name: 'Volatility 50 (1s)' },
      { id: 'R_75_1S', name: 'Volatility 75 (1s)' },
      { id: 'R_100_1S', name: 'Volatility 100 (1s)' }
    ];
    const MAX_HISTORY = 500;
    const COLLECT_THRESHOLD = 60;  // ticks needed before starting timer

    // ─── STATE ──────────────────────────────────────────────────────
    const marketData = {};
    SYMBOLS.forEach(s => {
      marketData[s.id] = {
        history: [],
        gaps: Array(10).fill(0),
        counts: Array(10).fill(0),
        lastPrice: '-',
        lastDigit: '-',
        predicted: '-',
        windowTicks: [],
        windowOpen: false,
        windowResolved: false,
        win: false
      };
    });

    let ws = null, reconnectAttempts = 0, paused = false;
    const MAX_RECONNECT = 12;
    let globalTickCount = 0;
    let soundEnabled = false, audioCtx = null;
    let signalRunning = false;
    let signalPhase = 'idle'; // idle, collecting, ready, go, window, result
    let signalCountdown = 15;
    let signalTimerInterval = null;
    let allMarketsReady = false;
    let windowActive = false;

    // ─── DOM REFS ──────────────────────────────────────────────────
    const gridEl = document.getElementById('grid');
    const logEl = document.getElementById('log');
    const appIdInput = document.getElementById('appIdInput');
    const apiTokenInput = document.getElementById('apiTokenInput');
    const saveSettingsBtn = document.getElementById('saveSettingsBtn');
    const clearSettingsBtn = document.getElementById('clearSettingsBtn');
    const startSignalBtn = document.getElementById('startSignalBtn');
    const stopSignalBtn = document.getElementById('stopSignalBtn');
    const statusEl = document.getElementById('status');
    const tickCounterEl = document.getElementById('tickCounter');
    const settingsError = document.getElementById('settingsError');
    const phaseTitle = document.getElementById('phaseTitle');
    const timerDisplay = document.getElementById('timerDisplay');
    const statusText = document.getElementById('statusText');
    const progressFill = document.getElementById('progressFill');
    const summaryEl = document.getElementById('summary');

    // ─── AUDIO ──────────────────────────────────────────────────────
    function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }
    function playBeep(freq, duration = 0.12) {
      if (!soundEnabled || !audioCtx) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.frequency.value = freq;
      gain.gain.setValueAtTime(0, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.4, audioCtx.currentTime + 0.01);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
      osc.start(); osc.stop(audioCtx.currentTime + duration);
    }
    function playDoubleBeep() {
      playBeep(1200, 0.35);
      setTimeout(() => playBeep(1200, 0.35), 400);
    }

    // ─── PREDICTION LOGIC (per market) ────────────────────────────
    function computePrediction(sym) {
      const md = marketData[sym];
      if (!md || md.history.length < 20) return null;
      const h = md.history;
      // Update counts
      const counts = Array(10).fill(0);
      h.forEach(d => counts[d]++);
      md.counts = counts;
      // Compute gaps: for each digit, distance from end to last occurrence; if never found, gap = history.length
      const gaps = Array(10).fill(0);
      for (let d = 0; d < 10; d++) {
        let g = 0;
        let found = false;
        for (let i = h.length - 1; i >= 0; i--) {
          if (h[i] === d) { found = true; break; }
          g++;
        }
        gaps[d] = found ? g : h.length;
      }
      md.gaps = gaps;
      // Pick digit with maximum gap; if tie, pick the one with smallest count (rarest)
      let maxGap = -1;
      let bestDigits = [];
      for (let d = 0; d < 10; d++) {
        if (gaps[d] > maxGap) {
          maxGap = gaps[d];
          bestDigits = [d];
        } else if (gaps[d] === maxGap) {
          bestDigits.push(d);
        }
      }
      let pred = bestDigits[0];
      if (bestDigits.length > 1) {
        // Tie-break: pick the one with lowest count
        let minCount = Infinity;
        for (let d of bestDigits) {
          if (counts[d] < minCount) {
            minCount = counts[d];
            pred = d;
          }
        }
      }
      return pred;
    }

    // ─── UI RENDERING ──────────────────────────────────────────────
    function buildGrid() {
      gridEl.innerHTML = '';
      SYMBOLS.forEach(s => {
        const card = document.createElement('div');
        card.className = 'card';
        card.id = 'card-' + s.id;
        card.innerHTML = `
          <div class="title"><span>${s.name}</span><span style="font-size:11px;color:#6b7280;">${s.id}</span></div>
          <div class="price">-</div>
          <div class="digits">
            <span class="last">-</span>
            <span style="color:#6b7280;">→</span>
            <span class="pred">-</span>
          </div>
          <div class="info">Gap: - | Count: -</div>
          <div class="dots">• • • • •</div>
          <div class="result pending">Waiting…</div>
        `;
        gridEl.appendChild(card);
      });
    }

    function updateCard(sym) {
      const md = marketData[sym];
      if (!md) return;
      const card = document.getElementById('card-' + sym);
      if (!card) return;
      const pred = md.predicted;
      card.querySelector('.price').textContent = md.lastPrice + ' | ' + md.history.length + ' ticks';
      card.querySelector('.last').textContent = md.lastDigit;
      card.querySelector('.pred').textContent = pred;
      const gap = pred !== '-' ? md.gaps[pred] : '-';
      const count = pred !== '-' ? md.counts[pred] : '-';
      card.querySelector('.info').textContent = `Gap: ${gap} | Count: ${count}`;
      // Window dots
      const dots = card.querySelector('.dots');
      if (md.windowOpen && !md.windowResolved) {
        let d = '';
        for (let i = 0; i < 5; i++) {
          if (i < md.windowTicks.length) d += md.windowTicks[i] + ' ';
          else d += '• ';
        }
        dots.textContent = d.trim();
      } else {
        dots.textContent = '• • • • •';
      }
      // Result
      const res = card.querySelector('.result');
      if (md.windowResolved) {
        if (md.win) {
          res.textContent = '✅ WIN';
          res.className = 'result win';
          card.classList.add('win');
          card.classList.remove('loss');
        } else {
          res.textContent = '❌ LOSS';
          res.className = 'result loss';
          card.classList.add('loss');
          card.classList.remove('win');
        }
      } else {
        res.textContent = md.windowOpen ? '⏳ Window Open…' : '⏳ Waiting…';
        res.className = 'result pending';
        card.classList.remove('win', 'loss');
      }
    }

    function updateAllCards() {
      SYMBOLS.forEach(s => updateCard(s.id));
    }

    // ─── LOGGING ──────────────────────────────────────────────────
    function addLog(entry, type = 'info') {
      const div = document.createElement('div');
      div.className = 'entry ' + type;
      div.textContent = entry;
      logEl.prepend(div);
      while (logEl.children.length > 200) logEl.removeChild(logEl.lastChild);
    }

    // ─── PROCESS TICK ─────────────────────────────────────────────
    function processTick(sym, quote, digit) {
      if (paused) return;
      const md = marketData[sym];
      if (!md) return;
      md.history.push(digit);
      if (md.history.length > MAX_HISTORY) md.history.shift();
      md.lastPrice = quote;
      md.lastDigit = digit;

      // Update prediction
      const newPred = computePrediction(sym);
      if (newPred !== null) md.predicted = newPred;

      // If window is open for this market, collect tick
      if (md.windowOpen && !md.windowResolved) {
        md.windowTicks.push(digit);
        // Check if we have 5 ticks
        if (md.windowTicks.length >= 5) {
          md.windowResolved = true;
          // Check if predicted digit appears
          const pred = md.predicted;
          if (pred !== '-' && md.windowTicks.includes(pred)) {
            md.win = true;
          } else {
            md.win = false;
          }
          updateCard(sym);
          // Check if all markets resolved
          checkAllResolved();
        } else {
          updateCard(sym);
        }
      } else {
        // Just update card (prediction may change)
        updateCard(sym);
      }

      // Update global tick counter
      globalTickCount++;
      tickCounterEl.textContent = `📡 ${globalTickCount} ticks`;

      // Check if we have enough data to start signal if not yet running
      if (signalRunning && signalPhase === 'idle') {
        checkAllMarketsReady();
      }
    }

    // ─── SIGNAL TIMER ─────────────────────────────────────────────
    function checkAllMarketsReady() {
      let ready = true;
      SYMBOLS.forEach(s => {
        const md = marketData[s.id];
        if (!md || md.history.length < COLLECT_THRESHOLD) ready = false;
      });
      if (ready && signalRunning && signalPhase === 'idle') {
        allMarketsReady = true;
        startCountdown();
      }
    }

    function startCountdown() {
      if (!signalRunning) return;
      signalPhase = 'ready';
      signalCountdown = 15;
      // Update predictions for all markets
      SYMBOLS.forEach(s => {
        const md = marketData[s.id];
        const pred = computePrediction(s.id);
        if (pred !== null) md.predicted = pred;
        md.windowOpen = false;
        md.windowResolved = false;
        md.windowTicks = [];
        md.win = false;
        updateCard(s.id);
      });
      updateSummary('READY – All markets ready');
      addLog('🔔 Signal started – 15s countdown for all markets', 'info');

      if (signalTimerInterval) clearInterval(signalTimerInterval);
      signalTimerInterval = setInterval(() => {
        if (!signalRunning) { clearInterval(signalTimerInterval); return; }
        signalCountdown--;
        updateTimerUI();
        if (signalCountdown <= 0) {
          clearInterval(signalTimerInterval);
          signalTimerInterval = null;
          openTradeWindows();
        }
      }, 1000);
      updateTimerUI();
    }

    function updateTimerUI() {
      const sec = signalCountdown;
      const mm = String(Math.floor(sec / 60)).padStart(2, '0');
      const ss = String(sec % 60).padStart(2, '0');
      timerDisplay.textContent = mm + ':' + ss;
      const progress = ((15 - sec) / 15) * 100;
      progressFill.style.width = progress + '%';

      if (sec > 5) {
        // READY
        signalPhase = 'ready';
        phaseTitle.textContent = '◉ SIGNAL FOUND – READY';
        phaseTitle.style.color = '#ffcc33';
        timerDisplay.style.color = '#7ec8e3';
        timerDisplay.classList.remove('blink');
        statusText.textContent = 'READY';
        statusText.style.color = '#ffcc33';
        progressFill.style.background = '#7ec8e3';
        windowActive = false;
        updateSummary(`Ready in ${sec}s`);
        // low beep optional
      } else if (sec > 0) {
        // GO TIME
        if (signalPhase !== 'go') {
          signalPhase = 'go';
          phaseTitle.textContent = '◉ GO TIME!';
          phaseTitle.style.color = '#ff3b3b';
          timerDisplay.style.color = '#ff3b3b';
          timerDisplay.classList.add('blink');
          statusText.textContent = 'GO TIME! ⚡';
          statusText.style.color = '#ff3b3b';
          progressFill.style.background = '#ff3b3b';
          addLog('⚡ GO TIME!', 'info');
          updateSummary('GO TIME! Get ready');
        }
        playBeep(880, 0.12);
        updateSummary(`GO in ${sec}s`);
      } else {
        // reached 0 -> handled separately
      }
    }

    function openTradeWindows() {
      if (!signalRunning) return;
      signalPhase = 'window';
      windowActive = true;
      timerDisplay.textContent = '00:00';
      timerDisplay.style.color = '#60a5fa';
      timerDisplay.classList.remove('blink');
      phaseTitle.textContent = '● TRADE WINDOWS OPEN';
      phaseTitle.style.color = '#60a5fa';
      statusText.textContent = 'WINDOWS OPEN';
      statusText.style.color = '#60a5fa';
      progressFill.style.background = '#60a5fa';
      progressFill.style.width = '100%';
      updateSummary('Trade windows open – collecting 5 ticks per market');
      playDoubleBeep();
      addLog('🚪 Trade windows opened for all markets', 'info');

      // Open window for each market
      SYMBOLS.forEach(s => {
        const md = marketData[s.id];
        md.windowOpen = true;
        md.windowResolved = false;
        md.windowTicks = [];
        md.win = false;
        updateCard(s.id);
      });

      // Set a safety timeout to resolve if some markets don't get 5 ticks (shouldn't happen)
      setTimeout(() => {
        if (signalRunning) checkAllResolved();
      }, 10000);
    }

    function checkAllResolved() {
      let allResolved = true;
      SYMBOLS.forEach(s => {
        const md = marketData[s.id];
        if (md.windowOpen && !md.windowResolved) allResolved = false;
      });
      if (allResolved && windowActive) {
        windowActive = false;
        showResults();
      } else {
        // force resolve any still open after 10s (safety)
        setTimeout(() => {
          if (signalRunning) {
            SYMBOLS.forEach(s => {
              const md = marketData[s.id];
              if (md.windowOpen && !md.windowResolved) {
                md.windowResolved = true;
                md.win = false; // assume loss
                updateCard(s.id);
              }
            });
            checkAllResolved();
          }
        }, 2000);
      }
    }

    function showResults() {
      if (!signalRunning) return;
      signalPhase = 'result';
      // Build summary
      let lines = [];
      SYMBOLS.forEach(s => {
        const md = marketData[s.id];
        const pred = md.predicted;
        const last = md.lastDigit;
        const ticks = md.windowTicks.join(',');
        const win = md.win;
        lines.push(`${s.name}: Predict ${pred} | Last ${last} | Ticks ${ticks} | ${win ? '✅ WIN' : '❌ LOSS'}`);
      });
      const summaryText = lines.join('  ');
      updateSummary('RESULTS: ' + summaryText);
      addLog('📊 Results:\n' + lines.join('\n'), 'info');

      // Show result for 4s then restart
      phaseTitle.textContent = '📊 RESULTS';
      phaseTitle.style.color = '#93c5fd';
      timerDisplay.textContent = '--';
      statusText.textContent = 'Restarting…';
      progressFill.style.background = '#93c5fd';

      setTimeout(() => {
        if (signalRunning) {
          // Reset windows and start again
          SYMBOLS.forEach(s => {
            const md = marketData[s.id];
            md.windowOpen = false;
            md.windowResolved = false;
            md.windowTicks = [];
            md.win = false;
            updateCard(s.id);
          });
          startCountdown();
        }
      }, 4000);
    }

    function updateSummary(text) {
      summaryEl.textContent = text;
    }

    // ─── SIGNAL CONTROL ────────────────────────────────────────────
    function startSignal() {
      if (signalRunning) return;
      // Reset all market window states
      SYMBOLS.forEach(s => {
        const md = marketData[s.id];
        md.windowOpen = false;
        md.windowResolved = false;
        md.windowTicks = [];
        md.win = false;
        md.predicted = computePrediction(s.id) || '-';
        updateCard(s.id);
      });
      signalRunning = true;
      signalPhase = 'idle';
      allMarketsReady = false;
      windowActive = false;
      if (signalTimerInterval) clearInterval(signalTimerInterval);
      phaseTitle.textContent = '⏳ COLLECTING TICKS';
      phaseTitle.style.color = '#ffcc33';
      timerDisplay.textContent = '--';
      statusText.textContent = 'Collecting data…';
      progressFill.style.width = '0%';
      updateSummary('Collecting ticks for all markets…');
      addLog('▶️ Signal started – collecting ticks', 'info');
      checkAllMarketsReady();
      // Also start a periodic check
      if (signalTimerInterval) clearInterval(signalTimerInterval);
      signalTimerInterval = setInterval(() => {
        if (!signalRunning) { clearInterval(signalTimerInterval); return; }
        if (signalPhase === 'idle') {
          checkAllMarketsReady();
          // update progress
          let total = 0;
          SYMBOLS.forEach(s => { total += marketData[s.id].history.length; });
          const avg = Math.round(total / SYMBOLS.length);
          const pct = Math.min(100, (avg / COLLECT_THRESHOLD) * 100);
          progressFill.style.width = pct + '%';
          updateSummary(`Collecting… ${avg}/${COLLECT_THRESHOLD} avg ticks`);
        }
      }, 500);
    }

    function stopSignal() {
      signalRunning = false;
      if (signalTimerInterval) clearInterval(signalTimerInterval);
      signalTimerInterval = null;
      signalPhase = 'idle';
      phaseTitle.textContent = '⏹ SIGNAL STOPPED';
      phaseTitle.style.color = '#fca5a5';
      timerDisplay.textContent = '--';
      statusText.textContent = 'Stopped';
      progressFill.style.width = '0%';
      updateSummary('');
      addLog('⏹ Signal stopped', 'info');
      SYMBOLS.forEach(s => {
        const md = marketData[s.id];
        md.windowOpen = false;
        md.windowResolved = false;
        md.windowTicks = [];
        md.win = false;
        updateCard(s.id);
      });
    }

    // ─── WEBSOCKET ──────────────────────────────────────────────────
    function connect() {
      const appId = appIdInput.value.trim();
      if (!appId) {
        settingsError.textContent = '⚠️ Please enter your App ID.';
        settingsError.style.display = 'block';
        return;
      }
      settingsError.style.display = 'none';

      if (ws && (ws.readyState === WebSocket.OPEN || ws.readyState === WebSocket.CONNECTING)) ws.close();

      const wsUrl = `wss://api.derivws.com/trading/v1/options/ws/public?app_id=${appId}`;
      console.log(`🔗 Connecting to ${wsUrl}`);
      addLog(`🔗 Connecting to public WebSocket (app_id: ${appId})`, 'info');
      statusEl.className = 'connecting';
      statusEl.textContent = '● Connecting…';
      ws = new WebSocket(wsUrl);

      ws.onopen = () => {
        console.log('✅ WebSocket opened');
        addLog('✅ WebSocket opened', 'info');
        statusEl.className = 'live';
        statusEl.textContent = '● Live';
        reconnectAttempts = 0;
        // Subscribe to ALL symbols
        SYMBOLS.forEach(s => {
          const req = { ticks: s.id, subscribe: 1 };
          console.log(`📤 Sending subscribe: ${JSON.stringify(req)}`);
          ws.send(JSON.stringify(req));
        });
        addLog(`📡 Subscribed to ${SYMBOLS.length} symbols`, 'info');
      };

      ws.onmessage = (msg) => {
        try {
          const data = JSON.parse(msg.data);
          console.log('📨 Message received:', data);
          if (data.error) {
            console.error('❌ Server error:', data.error);
            addLog(`❌ Server error: ${data.error.message} (code: ${data.error.code})`, 'error');
            settingsError.textContent = `Server error: ${data.error.message}`;
            settingsError.style.display = 'block';
            return;
          }
          if (!data.tick) return;
          const sym = data.tick.symbol;
          if (!marketData[sym]) {
            console.warn(`⚠️ Unknown symbol: ${sym}`);
            return;
          }
          const quote = data.tick.quote;
          if (quote === undefined || quote === null) return;
          const digit = parseInt(quote.toString().slice(-1));
          if (isNaN(digit)) return;

          processTick(sym, quote.toString(), digit);
        } catch (e) {
          console.warn('⚠️ Error parsing message:', e);
        }
      };

      ws.onclose = (event) => {
        console.warn(`⚠️ WebSocket closed: code=${event.code}, reason=${event.reason || 'none'}`);
        addLog(`⚠️ WebSocket closed (code: ${event.code})`, 'error');
        statusEl.className = 'error';
        statusEl.textContent = '● Disconnected';
        if (reconnectAttempts < MAX_RECONNECT) {
          reconnectAttempts++;
          const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
          console.log(`⏳ Reconnecting in ${delay/1000}s (attempt ${reconnectAttempts})`);
          addLog(`⏳ Reconnecting in ${delay/1000}s (attempt ${reconnectAttempts})`, 'info');
          setTimeout(connect, delay);
        } else {
          statusEl.textContent = '⚠️ Failed – refresh page';
          console.error('❌ Max reconnection attempts reached.');
          addLog('❌ Max reconnection attempts reached. Please refresh.', 'error');
        }
      };

      ws.onerror = (err) => {
        console.error('❌ WebSocket error:', err);
        addLog(`❌ WebSocket error: ${err.message || 'unknown'}`, 'error');
      };
    }

    // ─── EVENTS ──────────────────────────────────────────────────
    saveSettingsBtn.addEventListener('click', () => {
      const appId = appIdInput.value.trim();
      const token = apiTokenInput.value.trim();
      if (!appId) { settingsError.textContent = '⚠️ App ID is required.'; settingsError.style.display = 'block'; return; }
      settingsError.style.display = 'none';
      localStorage.setItem('deriv_creds', JSON.stringify({ appId, token }));
      if (ws) { ws.close(); }
      connect();
    });

    clearSettingsBtn.addEventListener('click', () => {
      localStorage.removeItem('deriv_creds');
      appIdInput.value = '';
      apiTokenInput.value = '';
      if (ws) { ws.close(); }
    });

    startSignalBtn.addEventListener('click', () => {
      if (!soundEnabled) {
        // Ask to enable sound
        if (confirm('Enable sound alerts?')) {
          soundEnabled = true;
          initAudio();
          document.querySelector('#startSignalBtn').style.background = '#065f46';
        }
      }
      startSignal();
    });

    stopSignalBtn.addEventListener('click', stopSignal);

    // Sound toggle (extra)
    document.addEventListener('keydown', (e) => {
      if (e.key === 's' || e.key === 'S') {
        soundEnabled = !soundEnabled;
        if (soundEnabled) initAudio();
        addLog(`Sound ${soundEnabled ? 'ON' : 'OFF'}`, 'info');
      }
    });

    // ─── INIT ──────────────────────────────────────────────────────
    // Load saved credentials
    try {
      const saved = localStorage.getItem('deriv_creds');
      if (saved) {
        const cred = JSON.parse(saved);
        if (cred.appId) appIdInput.value = cred.appId;
        if (cred.token) apiTokenInput.value = cred.token;
      }
    } catch (_) {}

    buildGrid();
    // Connect if appId present
    if (appIdInput.value.trim()) connect();

    // Start with idle UI
    phaseTitle.textContent = '⏳ IDLE';
    timerDisplay.textContent = '--';
    statusText.textContent = 'Press Start to begin';
    progressFill.style.width = '0%';
  </script>
</body>
</html>
